<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/contact.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog-contact</title>
</head>
<body>
    <section class="wrapper-contact">
        <div class="container">
            <div class="wrap-contact">
                <div class="item-contact left">
                    <div class="wrap-item-contact">
                        <div class="title-box">
                            <div class="sub-title-box">
                                <span>CONTACT US</span>
                                <div class="shape-box1"><img decoding="async" src="images/shape/shape-title1.png" alt="55"></div>
                                <div class="shape-box2"><img decoding="async" src="images/shape/shape-title2.png" alt="56"></div>
                            </div>
                            <h2>Feel free to get in touch with experts</h2>
                            
                        </div>
                        <div class="contact-icone-box">
                            <div class="icone-box">
                               <i class="fa-solid fa-phone-alt"></i>
                            </div>
                            <div class="lien-contact">
                                <a class="lien-contact1" href="">+92(003)68-090</a>
                                <a class="lien-contact2" href="">needhelp@company.com</a>
                            </div>
                        </div>
                        <p>30 commercial Broklyn Road <br> Fratton,Australia</p>
                    </div>
                </div>
                <div class="item-contact right">
                    <div class="wrap-item-contact">
                        <div class="input-field-box quatre">
                            <div class="input-field"><input type="text" placeholder="Your name"></div>
                            <div class="input-field"><input type="text" placeholder="Email address"></div>
                            <div class="input-field"><input type="text" placeholder="phone number"></div>
                            <div class="input-field"><input type="text" placeholder="subject"></div>
                        </div>
                        <div class="textarea-box">
                            <textarea placeholder="subject" name="" id=""></textarea>
                        </div>
                        <div class="btn-box">
                            <button class="btn">Send a message</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
